<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Cadastro Administrador - UrbanLink
  </title>
  <link href="./css/autenticacao.css" rel="stylesheet"/>
  <link href="./css/funcionalidades.css" rel="stylesheet"/>
 </head>
 <body data-page="cadastro" data-role="Administrador">
  <main class="area-autenticacao">
   <div class="cartao-autenticacao">
    <h1 class="titulo-autenticacao">
     Crie a sua conta para começar
    </h1>
    <div class="etiqueta-tipo-usuario">
     Administrador
    </div>
    <form class="formulario" id="form-cadastro">
     <div class="grupo-form">
      <label for="nome">
       Nome completo
      </label>
      <input id="nome" name="nome" placeholder="Como devemos te chamar?" required="" type="text"/>
     </div>
     <div class="linha-form">
      <div class="grupo-form">
       <label for="cpf">
        CPF
       </label>
       <input id="cpf" name="cpf" placeholder="000.000.000-00" type="text"/>
      </div>
      <div class="grupo-form">
       <label for="cnpj">
        CNPJ da Empresa
       </label>
       <input id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" type="text"/>
      </div>
     </div>
     <div class="grupo-form">
      <label for="email">
       E-mail
      </label>
      <input id="email" name="email" placeholder="voce@email.com" required="" type="email"/>
     </div>
     <div class="grupo-form">
      <label for="celular">
       Número de celular
      </label>
      <input id="celular" name="telefone" placeholder="(21) 90000-0000" type="tel"/>
     </div>
     <div class="linha-form">
      <div class="grupo-form">
       <label for="senha">
        Nova senha
       </label>
       <input id="senha" name="senha" placeholder="Mínimo de 8 caracteres" required="" type="password"/>
      </div>
      <div class="grupo-form">
       <label for="confirmar-senha">
        Confirmar senha
       </label>
       <input id="confirmar-senha" name="confirmar_senha" placeholder="Repita a senha" required="" type="password"/>
      </div>
     </div>
     <div class="grupo-form">
      <label for="codigo-convite">
       Código de convite de administrador
      </label>
      <input id="codigo-convite" name="codigo_convite" placeholder="Informe o código fornecido pelo responsável" required="True" type="password"/>
     </div>
     <div class="grupo-checkbox">
      <input checked="" id="termos" required="" type="checkbox"/>
      <label class="texto-checkbox" for="termos">
       Li e aceito os termos de uso e a política de privacidade
      </label>
     </div>
     <button class="botao botao-primario" type="submit">
      Criar minha conta
     </button>
    </form>
   </div>
  </main>
  <script defer="True" src="./js/app.js">
  </script>
 </body>
</html>
